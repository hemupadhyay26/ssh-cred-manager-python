[project]
name = "ssh-cred-manager-python"
version = "1.1.1"
description = "A CLI tool to manage SSH credentials easily without manual alias creation, with seamless machine migration support"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.3",
    "keyring>=25.7.0",
    "paramiko>=4.0.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "typer>=0.20.0",
    "questionary>=2.0.1",
    "textual>=8.2.8",
    "python-dotenv>=1.0",
]

[project.scripts]
ssh-cred = "main:app"
ssc = "main:app"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "cli*", "ssh*", "utils*"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Block syntax/undefined-name mistakes without imposing a large formatting rewrite.
select = ["E9", "F63", "F7", "F82"]
