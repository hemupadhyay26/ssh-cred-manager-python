name: Build Linux binaries
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      tag:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    name: Binary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install build and terminal tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils openssh-client tmux rsync
          python -m pip install uv==0.11.0
      - name: Build one-file executable
        run: |
          uv sync --frozen
          uv run --frozen pyinstaller --noconfirm --clean --distpath dist/binary --workpath build/pyinstaller ssc.spec
      - name: Run functional regressions on target architecture
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Test the standalone executable
        run: .venv/bin/python scripts/test_binary.py dist/binary/ssc
      - name: Package binary and checksum
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: .venv/bin/python scripts/package_binary.py --arch "$TARGET_ARCH" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-binary-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Download uploaded binary artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: linux-binary-${{ matrix.arch }}
          path: downloaded-binary
      - name: Verify downloaded archive checksum
        working-directory: downloaded-binary
        run: sha256sum -c ./*.sha256
