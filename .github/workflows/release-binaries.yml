name: Release binaries
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching package version (e.g. v1.0.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-binaries-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  binaries:
    name: Binary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install build and terminal tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils openssh-client tmux rsync
          python -m pip install uv==0.11.0
      - name: Build one-file executable
        run: |
          uv sync --frozen
          uv run --frozen pyinstaller --noconfirm --clean --distpath dist/binary --workpath build/pyinstaller ssc.spec
      - name: Run functional regressions on target architecture
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Test the standalone executable
        run: .venv/bin/python scripts/test_binary.py dist/binary/ssc
      - name: Package binary and checksum
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: .venv/bin/python scripts/package_binary.py --arch "$TARGET_ARCH" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  upload:
    name: Attach verified binaries to release
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-binary-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums and upload both architectures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          cd release-assets
          test "$(find . -name '*linux-amd64.tar.gz' | wc -l)" -eq 1
          test "$(find . -name '*linux-arm64.tar.gz' | wc -l)" -eq 1
          cat *.sha256 > SHA256SUMS-binaries
          sha256sum -c SHA256SUMS-binaries
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" ./*.tar.gz ./*.sha256 SHA256SUMS-binaries --clobber
